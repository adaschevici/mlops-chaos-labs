services:
  # Monitoring stack
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: lab01-redis-exporter
    depends_on:
      - redis
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - lab01-network

  # The helper container
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Mount socket here instead
    environment:
      - CONTAINERS=1 # Allow listing containers
      - NETWORKS=1
    # only uncomment if you want to test from the host using curl
    # curl -i http://localhost:2375/containers/json
    # curl -i http://localhost:2375/networks
    # ports:
    #   - "127.0.0.1:2375:2375" # <--- Map to localhost only for security
    networks:
      - lab01-network
    healthcheck:
      # We check /containers/json because you enabled CONTAINERS=1.
      # If we checked /version, it would fail (403 Forbidden) unless you added VERSION=1.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2375/containers/json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:latest
    container_name: lab01-prometheus
    depends_on:
      docker-proxy:
        condition: service_healthy
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - lab01-network
  
  grafana:
    image: grafana/grafana:latest
    container_name: lab01-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./monitoring/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    networks:
      - lab01-network


volumes:
  prometheus-data:
  grafana-data:

networks:
  lab01-network:
    driver: bridge

