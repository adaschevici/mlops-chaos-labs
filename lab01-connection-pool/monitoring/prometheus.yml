# monitoring/prometheus.yml
global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Alert rules
rule_files:
  - 'alerts.yml'

scrape_configs:
  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
  
  # Node/system metrics (if you add node-exporter)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
  
  # Celery metrics (if you instrument your workers)
  - job_name: 'celery'
    static_configs:
      - targets: ['celery-worker:8000']

  - job_name: 'celery-workers'
    docker_sd_configs:
      - host: tcp://docker-proxy:2375 # Connect to the proxy service
    
    relabel_configs:
      # 1. Only scrape containers with this specific label
      #    (You need to add this label to your celery-worker service in compose)
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: celery-worker
        action: keep

      # 2. (Optional) Set the hostname in Prometheus to the container name 
      #    so it looks nice in Grafana (e.g., "project-celery-worker-1")
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: instance
        replacement: '$1'
