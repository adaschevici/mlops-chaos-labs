services:
  redis:
    image: redis:7-alpine
    container_name: lab01-redis
    ports:
      - "6379:6379"
    command: redis-server --maxclients 5000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lab01-network
  
  celery-worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    # container_name: lab01-celery-worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./app:/app
    command: celery -A tasks worker --loglevel=info --concurrency=200
    networks:
      - lab01-network

networks:
  lab01-network:
    driver: bridge
